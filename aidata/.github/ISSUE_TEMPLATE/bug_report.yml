name: Bug report
description: Report a reproducible bug in AIDATA
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please provide a minimal reproduction. Do not include private datasets or secrets.
  - type: input
    id: version
    attributes:
      label: AIDATA version
      placeholder: "0.5.6"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code or dataset construction that reproduces the issue.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or logs
      render: text
